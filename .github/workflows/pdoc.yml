name: Generate pdoc Documentation for Zynthian UI (Oram Branch)

on:
  push:
    branches: [ oram ]  # Nur auf den 'oram'-Branch reagieren
  workflow_dispatch:    # Manuelles Auslösen erlauben

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Erlaubt das Schreiben für GitHub Pages Deployment

    steps:
      # 1. Repository auschecken (inkl. Submodules falls nötig)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: oram   # Spezifischer Branch
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python einrichten
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Zynthian verwendet typischerweise Python 3.11
          cache: 'pip'

      # 3. Abhängigkeiten installieren (angepasst für Zynthian)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdoc
          # Grundlegende Abhängigkeiten, die für Importe nötig sein könnten
          pip install tornado pyyaml

      # 4. Dokumentation generieren (mit Fehlerumgehung)
      - name: Generate documentation
        run: |
          # Versuche, eingeschränkte Dokumentation zu generieren
          pdoc --html zynthian_main --output-dir ./docs-build --force || echo "pdoc fehlgeschlagen, aber wir fahren fort"
          # Alternative: Nur bestimmte Module dokumentieren
          pdoc --html zynthian_config --output-dir ./docs-build --force

      # 5. GitHub Pages deployment
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-build
          keep_files: false
