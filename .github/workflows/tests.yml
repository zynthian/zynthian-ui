name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      ZYNCODER_DIR: ${{ github.workspace }}/zyncoder-src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Shared libraries needed by the Python bindings, plus what is needed to build the real
      # libzyncore.so (cmake, gcc) and to run a private dummy JACK server (jackd2) for tests/native.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libjack-jackd2-0 libjack-jackd2-dev jackd2 libasound2-dev liblo-dev xvfb cmake build-essential

      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (syntax errors / undefined names)
        run: ruff check .

      # The zyncoder repo is separate; the real router is built from it (TOUCH_ONLY: no wiringPi / I2C).
      - uses: actions/checkout@v4
        with:
          repository: zynthian/zyncoder
          path: zyncoder-src

      - name: Build real libzyncore.so (TOUCH_ONLY)
        run: tests/native/build_zyncore.sh "$GITHUB_WORKSPACE/zyncoder-src"

      # Hermetic suite (unit + integration + architecture, native libs faked) plus tests/native, which
      # run the real router on a private `jackd -d dummy` started by the tests themselves.
      - name: Tests
        run: xvfb-run -a python -m pytest -ra
