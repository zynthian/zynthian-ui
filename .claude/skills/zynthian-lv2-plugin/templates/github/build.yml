# @@NAME@@ - build the LV2 bundle for x86_64 and arm64 (zynthian) on every change.
#
# - Each push / pull request: build on native runners (the TTL is generated by running the plugin, so no
#   cross-compiling), inside Debian @@DEBIAN@@ (zynthian OS base: same glibc and libraries as the device).
#   The bundles are kept as workflow artifacts.
# - Push to the default branch: the bundles are published in the rolling "latest" prerelease.
# - Tag v*: the bundles are published in a release with that name.
#
# Generated by the zynthian-lv2-plugin skill. arm64 runners (ubuntu-24.04-arm) are free for public repositories.

name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN: @@SYMBOL@@

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:@@DEBIAN@@
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config git ca-certificates \
            libcairo2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libgl-dev python3
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # DPF, pinned to the commit recorded in this repo
      - name: Build
        run: make -j"$(nproc)"
      - name: Check the bundle
        run: |
          b="bin/$PLUGIN.lv2"
          ls -la "$b"
          for f in manifest.ttl "${PLUGIN}_dsp.ttl" "${PLUGIN}_dsp.so" "${PLUGIN}_ui.so" "zynthian_widget_$PLUGIN.py"; do
            test -s "$b/$f" || { echo "missing $b/$f"; exit 1; }
          done
          grep -qE "zyngui(:|#)widget" "$b/manifest.ttl" || { echo "zyngui:widget not declared"; exit 1; }
      - name: Package
        run: tar -C bin -czf "$PLUGIN-lv2-${{ matrix.arch }}.tar.gz" "$PLUGIN.lv2"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}-lv2-${{ matrix.arch }}
          path: ${{ env.PLUGIN }}-lv2-${{ matrix.arch }}.tar.gz
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes *.tar.gz \
              || gh release upload "$GITHUB_REF_NAME" --clobber *.tar.gz
          else
            # Rolling prerelease with the last build of the default branch
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest --prerelease --target "$GITHUB_SHA" --title "Latest build" \
              --notes "Last build of ${GITHUB_SHA::7} ($(date -u +%F)). Unpack into the LV2 path: tar -xzf <file> -C /zynthian/zynthian-plugins/lv2" \
              *.tar.gz
          fi
